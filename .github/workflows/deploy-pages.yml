name: Bygg sjekk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Bygg som live (samme som sync.yml i MatsAmundsen.github.io)
        run: |
          npm ci
          set +e
          npm run build:pages
          set -e
      - name: Bekreft innhold
        run: |
          test -f .output/public/index.html
          grep -q "hero-wrap" .output/public/index.html
          grep -q "mg-build" .output/public/index.html
          test -f .output/public/version.json
          test -f .output/public/app.js
