name: Bygg sjekk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bygg dist
        run: |
          cp build.js build.cjs
          cp scripts/prepare-dist.js scripts/prepare-dist.cjs
          node build.cjs
          node scripts/prepare-dist.cjs
      - name: Bekreft innhold
        run: |
          test -f dist/index.html
          test -f dist/data.js
          grep -q tallmengder dist/data.js
          test -f dist/fagstoff/tallmengder.html
